<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super System Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div class="login-screen" id="login-screen"><div class="login-box"><h1>Admin login</h1><p class="sub">Use the admin email created in Supabase Authentication.</p><form id="login-form"><div class="field"><label>Email</label><input type="email" id="login-email" required></div><div class="field"><label>Password</label><input type="password" id="login-password" required></div><button class="btn">Log in</button><p class="error-text" id="login-error"></p></form><p class="hint"><a href="index.html">← Back to website</a></p></div></div>
<div class="dash" id="dash"><aside class="sidebar"><div class="brand">Super System Admin</div><button class="tab active" data-panel="products">Products</button><button class="tab" data-panel="settings">Website Settings</button><a class="tab" href="index.html">View website</a><button class="logout-btn" id="logout-btn">Log out</button></aside><main class="main"><section class="tab-panel active" id="panel-products"><div class="main-head"><h2>Products</h2><span class="pill" id="product-count">0 total</span></div>
<div class="product-form"><h3 id="product-form-title">Add a product</h3><form id="product-form"><input type="hidden" id="product-id"><div class="form-grid"><div class="field"><label>Product name</label><input id="p-name" required></div><div class="field"><label>Category</label><select id="p-category"><option>CCTV</option><option>Computer</option><option>Accessories</option><option>Networking</option></select></div><div class="field"><label>Regular price (₹)</label><input type="number" id="p-price" min="0" required></div><div class="field"><label>Offer price (₹)</label><input type="number" id="p-offer" min="0"></div><div class="field"><label>Stock</label><input type="number" id="p-stock" min="0" value="0"></div><div class="field"><label>Sort order</label><input type="number" id="p-sort" value="0"></div><div class="field full"><label>Product image URL</label><input type="url" id="p-image" placeholder="https://..."></div><div class="field full"><label>Description</label><textarea id="p-description"></textarea></div><div class="field full checkbox-field"><input type="checkbox" id="p-best"><label for="p-best">Show best offer badge</label></div><div class="field full checkbox-field"><input type="checkbox" id="p-active" checked><label for="p-active">Show on website</label></div></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn" id="save-btn" style="width:auto">Add product</button><button type="button" class="btn-small" id="cancel-btn" hidden>Cancel edit</button></div><p class="error-text" id="form-message"></p></form></div>
<table class="admin-product-table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="product-table"><tr><td colspan="5">Loading…</td></tr></tbody></table></section>
<section class="tab-panel" id="panel-settings"><div class="main-head"><h2>Website Settings</h2></div><div class="product-form"><h3>Business details & ticker</h3><form id="settings-form"><div class="form-grid"><div class="field"><label>Site name</label><input id="s-name" required></div><div class="field"><label>WhatsApp number (country code + digits only)</label><input id="s-whatsapp" inputmode="numeric" pattern="[0-9]+" required placeholder="919876543210"></div><div class="field full"><label>Tagline</label><input id="s-tagline" required></div><div class="field full"><label>Address</label><textarea id="s-address" required></textarea></div><div class="field full"><label>Working hours</label><input id="s-hours" required placeholder="Mon–Sat, 10 AM–8 PM"></div><div class="field full"><label>Ticker messages (one message per line)</label><textarea id="s-ticker" rows="7" required></textarea></div></div><button class="btn" style="width:auto;margin-top:16px">Save website settings</button><p class="error-text" id="settings-message"></p></form></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="site-config.js"></script><script src="admin.js"></script></body></html>
